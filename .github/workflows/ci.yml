# CI for Project Nexus (Aether)
#
# Runs the language tests (703) and the linter on every push and PR.
# Build is intentionally skipped to keep the workflow light — the
# playground build runs on Vercel on every deploy instead. Run
# `bun run build` locally before pushing changes that touch
# next.config.ts or the playground UI.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Aether tests (vitest, 703 tests)
        run: bunx vitest run aether

      - name: Lint
        run: bun run lint
