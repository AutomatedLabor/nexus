[package]
name = "aether-fs"
version = "0.1.0"
description = "File system interface for Aether — 10 functions covering host-bound IO (readFile, writeFile, fileExists, listDir) and pure-Aether POSIX path manipulation (pathJoin, pathSplit, pathExt, pathBase, pathDir, pathNormalize)."
edition = "v3"

