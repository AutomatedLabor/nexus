[package]
name = "aether-list"
version = "0.1.0"
description = "Functional list utilities for Aether — 25 pure functions covering the Haskell-style Data.List API: head/tail/init/last, cons/append/reverse, intersperse/intercalate/transpose, subsequences/permutations, nub, sortWith/sortBy/groupBy, span/break_/takeWhile/dropWhile, partition, chunk, window, zipWith."
edition = "v3"

