[package]
name = "aether-set"
version = "0.1.0"
description = "Set operations for Aether — 20 pub functions: new, add, remove, has, size, to_array, union, intersect, difference, sym_diff, subset, superset, disjoint, equal, map, filter, fold, any, all, to_string. Sets are sorted-unique int arrays; has is O(log n); union/intersect/diff are O(n) merge scans."
edition = "v3"

